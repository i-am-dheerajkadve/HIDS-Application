name: web-application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker version
        run: docker --version

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/hids-app:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/hids-app:latest
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::947894440870:role/web-role-cloud-nexus-dheeraj
          aws-region: eu-north-1
          
      
      - name: Deploy on EC2 using SSM
        run: |
          aws ssm send-command \
          --instance-ids "i-071f9332610d93d05" \
          --document-name "AWS-RunShellScript" \
          --parameters commands="docker pull ${{ secrets.DOCKER_USERNAME }}/hids-app:latest && docker stop hids-app || true && docker rm hids-app || true && docker run -d -p 80:5000 --name hids-app ${{ secrets.DOCKER_USERNAME }}/hids-app:latest" \
          --region eu-north-1
