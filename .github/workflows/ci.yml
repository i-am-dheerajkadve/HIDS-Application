name: web-application

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: docker version 
          run: docker --version

        - name: login-Dockerhub-push
          uses: docker/login-actions@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}  
        - name: docker build
          run: docker build -t ${{ secrets.DOCKER_USERNAME }} hids-app .
            
        - name: Docker-push
          run:  docker push ${{ secrets.DOCKER_USERNAME }}/hids-app:latest
          
        - name: ec2_ssh
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script:
              docker pull ${{ secrets.DOCKER_USERNAME }}/hids-app:latest

               docker stop hids-container || true
               docker rm hids-container || true

               docker run -d -p 80.5000 --name hids-app /
               ${{ secrets.DOCKER_USERNAME }}/hids-app:latest
